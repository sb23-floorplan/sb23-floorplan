<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#163c4b"><title>SB23 Floorplan</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,sans-serif;color:#203540;background:#f3f6f7}header{background:#163c4b;color:white;padding:13px 17px;display:flex;justify-content:space-between;align-items:center}header b{font-size:20px}button,select,input{font:inherit}button{background:white;border:1px solid #c7d4d9;border-radius:9px;padding:10px 12px;color:#183b49;cursor:pointer}button.active{background:#167d80;color:white}button:disabled{opacity:.45}.tools{display:flex;flex-wrap:wrap;gap:7px;padding:10px;background:white;border-bottom:1px solid #d9e1e4}.tools label{display:flex;align-items:center;gap:5px}main{position:relative;height:calc(100dvh - 158px);min-height:330px;overflow:hidden;touch-action:none}svg{display:block;width:100%;height:100%;touch-action:none;background:#fff}#status{position:absolute;left:12px;bottom:12px;background:#ffffffec;border:1px solid #d9e1e4;border-radius:8px;padding:8px;font-size:13px;pointer-events:none}footer{display:flex;gap:8px;padding:9px;align-items:center;flex-wrap:wrap}dialog{border:0;border-radius:14px;padding:22px;max-width:min(92vw,410px);box-shadow:0 10px 45px #0004}dialog::backdrop{background:#0005}dialog input{padding:10px;width:100%;border:1px solid #abbfc7;border-radius:8px;margin:9px 0}dialog menu{display:flex;justify-content:flex-end;gap:8px;padding:0;margin:12px 0 0}#live{position:absolute;display:none;background:#167d80;color:white;padding:5px 9px;border-radius:7px;pointer-events:none;font-weight:600}small{color:#506975}@media(max-width:650px){main{height:calc(100dvh - 205px)}.tools button{padding:8px}.tools{gap:5px}}</style></head><body><header><b>SB23 <span style="font-weight:400">Floorplan</span></b><span>Prototype 1.0</span></header><div class="tools"><button id="wall" class="active">✏️ Muur</button><button id="room">▭ Kamer</button><button id="door">🚪 Deur</button><button id="window">▱ Raam</button><button id="name">Aa Ruimtenaam</button><button id="select">☝️ Selecteer</button><button id="undo">↶ Ongedaan</button><button id="fit">⤢ Passend</button><label><input type="checkbox" id="dims" checked> Maten tonen</label></div><main><svg id="drawing" xmlns="http://www.w3.org/2000/svg"><g id="viewport"><g id="grid"></g><g id="objects"></g><g id="preview"></g></g></svg><div id="live"></div><div id="status">Teken een muur door te slepen. 1 rastervak = 0,5 m.</div></main><footer><label>Verdieping <select id="floor"><option>Gelijkvloers</option><option>Eerste verdieping</option><option>Tweede verdieping</option><option>Kelder</option><option>Zolder</option></select></label><button id="save">Bewaar</button><button id="export">Exporteer SVG</button><button id="print">Print / PDF</button><button id="clear">Wis verdieping</button></footer><dialog id="editor"><b id="editorTitle">Afmeting</b><div id="editorHint"><small>Lengte in meter</small></div><input id="editValue" autocomplete="off" inputmode="decimal"><menu><button id="cancel">Annuleer</button><button id="delete" style="color:#ae3333">Verwijder</button><button id="apply" class="active">Toepassen</button></menu></dialog><script>
(()=>{'use strict';const svg=document.getElementById('drawing'),vp=document.getElementById('viewport'),objects=document.getElementById('objects'),preview=document.getElementById('preview'),grid=document.getElementById('grid'),live=document.getElementById('live'),status=document.getElementById('status'),floorEl=document.getElementById('floor'),dims=document.getElementById('dims');const NS='http://www.w3.org/2000/svg';let mode='wall',start=null,drag=null,selected=null,editing=null,zoom=1,offset={x:0,y:0};let project={};try{project=JSON.parse(localStorage.getItem('sb23floorplan')||'{}')}catch{};let floor='Gelijkvloers';const items=()=>project[floor]||(project[floor]=[]);const snap=n=>Math.round(n/10)*10;const metres=n=>(n/100).toFixed(2).replace('.',',')+' m';function el(tag,attrs={},parent=objects){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e}function coords(ev){const r=svg.getBoundingClientRect();return{x:(ev.clientX-r.left-offset.x)/zoom,y:(ev.clientY-r.top-offset.y)/zoom}}function screen(p){return{x:p.x*zoom+offset.x,y:p.y*zoom+offset.y}}function persist(){localStorage.setItem('sb23floorplan',JSON.stringify(project))}function setupGrid(){grid.replaceChildren();for(let i=-3000;i<=3000;i+=50){el('line',{x1:i,y1:-3000,x2:i,y2:3000,stroke:'#dce8eb','stroke-width':.65},grid);el('line',{x1:-3000,y1:i,x2:3000,y2:i,stroke:'#dce8eb','stroke-width':.65},grid)}}function updateTransform(){vp.setAttribute('transform',`translate(${offset.x} ${offset.y}) scale(${zoom})`)}function line(a,b,attrs={},parent=objects){return el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,...attrs},parent)}function label(x,y,text,parent=objects){const t=el('text',{x,y,'font-size':13,'text-anchor':'middle',fill:'#314f5b','paint-order':'stroke',stroke:'white','stroke-width':4},parent);t.textContent=text;return t}function render(){objects.replaceChildren();items().forEach((o,i)=>{const g=el('g',{'data-index':i});const chosen=selected===i;const stroke=chosen?'#d48222':'#273b48';if(o.type==='wall'){line(o.a,o.b,{stroke,'stroke-width':5,'stroke-linecap':'round'},g);if(dims.checked){let mx=(o.a.x+o.b.x)/2,my=(o.a.y+o.b.y)/2;label(mx,my-12,metres(Math.hypot(o.b.x-o.a.x,o.b.y-o.a.y)),g)}}else if(o.type==='room'){el('rect',{x:Math.min(o.a.x,o.b.x),y:Math.min(o.a.y,o.b.y),width:Math.abs(o.b.x-o.a.x),height:Math.abs(o.b.y-o.a.y),fill:'none',stroke,'stroke-width':5},g);if(dims.checked){label((o.a.x+o.b.x)/2,Math.min(o.a.y,o.b.y)-10,metres(Math.abs(o.b.x-o.a.x)),g);label(Math.max(o.a.x,o.b.x)+34,(o.a.y+o.b.y)/2,metres(Math.abs(o.b.y-o.a.y)),g)}}else if(o.type==='name'){label(o.x,o.y,o.text,g)}else if(o.type==='door'||o.type==='window'){const col=o.type==='door'?'#b97d35':'#238cb4';line({x:o.x-25,y:o.y},{x:o.x+25,y:o.y},{stroke:col,'stroke-width':o.type==='door'?3:6},g);if(o.type==='door')el('path',{d:`M ${o.x-25} ${o.y} A 50 50 0 0 1 ${o.x+25} ${o.y-43}`,fill:'none',stroke:col,'stroke-width':1.5},g)}})}function nearest(p){let best=-1,dist=Infinity;items().forEach((o,i)=>{let d=Infinity;if(o.type==='wall'){let vx=o.b.x-o.a.x,vy=o.b.y-o.a.y,t=Math.max(0,Math.min(1,((p.x-o.a.x)*vx+(p.y-o.a.y)*vy)/(vx*vx+vy*vy||1)));d=Math.hypot(p.x-o.a.x-t*vx,p.y-o.a.y-t*vy)}else if(o.type==='room'){let x1=Math.min(o.a.x,o.b.x),x2=Math.max(o.a.x,o.b.x),y1=Math.min(o.a.y,o.b.y),y2=Math.max(o.a.y,o.b.y);d=Math.min(Math.abs(p.x-x1),Math.abs(p.x-x2),Math.abs(p.y-y1),Math.abs(p.y-y2));if(p.x<x1-15||p.x>x2+15||p.y<y1-15||p.y>y2+15)d=Infinity}else d=Math.hypot(p.x-o.x,p.y-o.y);if(d<dist){dist=d;best=i}});return dist<25/zoom?best:-1}function snapped(p){return{x:snap(p.x),y:snap(p.y)}}function constrained(a,b){let dx=b.x-a.x,dy=b.y-a.y;if(Math.abs(dx)<Math.abs(dy)*.18)b.x=a.x;else if(Math.abs(dy)<Math.abs(dx)*.18)b.y=a.y;return b}function showPreview(p){preview.replaceChildren();if(!start)return;let b=constrained(start,snapped(p));if(mode==='wall')line(start,b,{stroke:'#167d80','stroke-width':4,'stroke-dasharray':'7 4'},preview);else el('rect',{x:Math.min(start.x,b.x),y:Math.min(start.y,b.y),width:Math.abs(b.x-start.x),height:Math.abs(b.y-start.y),fill:'#167d8012',stroke:'#167d80','stroke-width':3,'stroke-dasharray':'7 4'},preview);let txt=mode==='wall'?metres(Math.hypot(b.x-start.x,b.y-start.y)):metres(Math.abs(b.x-start.x))+' × '+metres(Math.abs(b.y-start.y));let sp=screen({x:(start.x+b.x)/2,y:(start.y+b.y)/2});live.style.display='block';live.style.left=Math.min(svg.clientWidth-130,Math.max(8,sp.x))+'px';live.style.top=Math.max(5,sp.y-42)+'px';live.textContent=txt}svg.addEventListener('pointerdown',ev=>{if(ev.button!==0)return;ev.preventDefault();svg.setPointerCapture(ev.pointerId);let p=coords(ev);drag={pointer:ev.pointerId,at:p};if(mode==='wall'||mode==='room'){start=snapped(p);showPreview(p)}else if(mode==='select'){selected=nearest(p);render();if(selected>=0)openEditor(selected)}else if(mode==='name'){let name=prompt('Benaming van de ruimte (bv. Keuken):','Woonkamer');if(name?.trim()){items().push({type:'name',x:snap(p.x),y:snap(p.y),text:name.trim()});persist();render()}}else{items().push({type:mode,x:snap(p.x),y:snap(p.y)});persist();render()}});svg.addEventListener('pointermove',ev=>{if(!drag||drag.pointer!==ev.pointerId)return;if(start)showPreview(coords(ev))});svg.addEventListener('pointerup',ev=>{if(!drag||drag.pointer!==ev.pointerId)return;if(start){let b=constrained(start,snapped(coords(ev)));if(Math.hypot(b.x-start.x,b.y-start.y)>5){items().push({type:mode,a:{...start},b});persist();render()}}start=null;drag=null;preview.replaceChildren();live.style.display='none'});svg.addEventListener('pointercancel',()=>{start=null;drag=null;preview.replaceChildren();live.style.display='none'});function setMode(m){mode=m;document.querySelectorAll('.tools button').forEach(b=>b.classList.toggle('active',b.id===m));status.textContent=({wall:'Sleep om een muur te tekenen. Lengte verschijnt live.',room:'Sleep om een rechthoekige kamer te tekenen.',door:'Tik waar je een deursymbool wilt plaatsen.',window:'Tik waar je een raamsymbool wilt plaatsen.',name:'Tik in de ruimte en voer een naam in.',select:'Tik op een object om het te wijzigen.'})[m]}['wall','room','door','window','name','select'].forEach(m=>document.getElementById(m).onclick=()=>setMode(m));document.getElementById('undo').onclick=()=>{items().pop();persist();render()};document.getElementById('save').onclick=()=>{persist();alert('Project lokaal bewaard op dit toestel.')};floorEl.onchange=()=>{floor=floorEl.value;selected=null;render()};dims.onchange=render;document.getElementById('clear').onclick=()=>{if(confirm('Alle objecten op deze verdieping wissen?')){project[floor]=[];persist();render()}};document.getElementById('fit').onclick=()=>{zoom=1;offset={x:svg.clientWidth/2-300,y:svg.clientHeight/2-220};updateTransform()};const dialog=document.getElementById('editor'),val=document.getElementById('editValue');function openEditor(i){editing=i;const o=items()[i];document.getElementById('editorTitle').textContent=o.type==='wall'?'Muurlengte aanpassen':o.type==='room'?'Kamerafmetingen aanpassen':o.type==='name'?'Ruimtenaam aanpassen':'Object';document.getElementById('editorHint').textContent=o.type==='room'?'Breedte × hoogte in meter (bv. 5,20 x 4,35)':o.type==='wall'?'Lengte in meter (bv. 4,25)':'Tekst';val.value=o.type==='wall'?(Math.hypot(o.b.x-o.a.x,o.b.y-o.a.y)/100).toFixed(2).replace('.',','):o.type==='room'?(Math.abs(o.b.x-o.a.x)/100).toFixed(2).replace('.',',')+' x '+(Math.abs(o.b.y-o.a.y)/100).toFixed(2).replace('.',','):o.text||'';dialog.showModal()}document.getElementById('cancel').onclick=()=>dialog.close();document.getElementById('delete').onclick=()=>{if(editing!==null){items().splice(editing,1);selected=null;persist();render()}dialog.close()};document.getElementById('apply').onclick=()=>{let o=items()[editing];if(!o)return;const num=s=>Number(s.trim().replace(',','.'));if(o.type==='wall'){let m=num(val.value);if(!(m>0&&m<1000))return alert('Geef een geldige lengte in.');let dx=o.b.x-o.a.x,dy=o.b.y-o.a.y,len=Math.hypot(dx,dy);o.b={x:o.a.x+dx/len*m*100,y:o.a.y+dy/len*m*100}}else if(o.type==='room'){let parts=val.value.toLowerCase().split(/[x×;]/).map(num);if(parts.length!==2||parts.some(n=>!(n>0&&n<1000)))return alert('Gebruik bijvoorbeeld 5,20 x 4,35');o.b={x:o.a.x+Math.sign(o.b.x-o.a.x||1)*parts[0]*100,y:o.a.y+Math.sign(o.b.y-o.a.y||1)*parts[1]*100}}else if(o.type==='name')o.text=val.value.trim();persist();render();dialog.close()};function exportSvg(){const clone=svg.cloneNode(true);clone.querySelector('#grid')?.remove();clone.querySelector('#preview')?.remove();let bb=objects.getBBox();if(bb.width<1||bb.height<1)return alert('Teken eerst een plan.');clone.setAttribute('viewBox',`${bb.x-65} ${bb.y-65} ${bb.width+130} ${bb.height+130}`);clone.setAttribute('width',Math.ceil(bb.width+130));clone.setAttribute('height',Math.ceil(bb.height+130));clone.querySelector('#viewport')?.removeAttribute('transform');clone.setAttribute('xmlns',NS);return new XMLSerializer().serializeToString(clone)}document.getElementById('export').onclick=()=>{let s=exportSvg();if(!s)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));a.download='SB23-'+floor.toLowerCase().replaceAll(' ','-')+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('print').onclick=()=>{let s=exportSvg();if(!s)return;let w=window.open('','_blank');if(!w)return alert('Sta pop-ups toe om naar PDF te printen.');w.document.write('<html><head><title>SB23 Floorplan</title><style>body{margin:0;display:grid;place-items:center;height:100vh}svg{width:95vw;height:90vh}</style></head><body>'+s+'</body></html>');w.document.close();setTimeout(()=>w.print(),350)};setupGrid();document.getElementById('fit').click();render();})();
</script></body></html>

<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>SB23 Floorplan</title><style>body{margin:0;font:15px -apple-system,BlinkMacSystemFont,sans-serif;background:#f3f5f7;color:#152536}header{background:#172c42;color:white;padding:14px 18px;font-weight:700;display:flex;justify-content:space-between}nav{display:flex;flex-wrap:wrap;gap:7px;padding:10px;background:white}button,input,select{font:inherit;border:1px solid #ccd3da;border-radius:8px;padding:9px;background:white}button.active{background:#1766a1;color:white}main{padding:10px}svg{background:white;border:1px solid #ccd3da;border-radius:8px;width:100%;height:68vh;touch-action:none}small{color:#526579}.hint{padding:7px 12px}#name{width:170px}#floor{max-width:140px}</style></head><body><header><span>SB23 | Floorplan</span><span>Prototype 1.0</span></header><nav><input id="name" placeholder="Dossier / adres"><select id="floor"><option>Gelijkvloers</option><option>Kelder</option><option>Verdieping 1</option><option>Zolder</option></select><button data-mode="wall" class="active">Muur</button><button data-mode="door">Deur</button><button data-mode="window">Raam</button><button data-mode="label">Ruimtenaam</button><button id="undo">↶ Ongedaan</button><button id="clear">Wissen</button><button id="save">Bewaren</button><button id="print">PDF / Print</button></nav><div class="hint" id="hint">Tik twee punten aan om een muur te tekenen. Raster: 25 cm.</div><main><svg id="canvas" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M 25 0 L 0 0 0 25" fill="none" stroke="#e5ebef" stroke-width="1"/></pattern></defs><rect width="1200" height="800" fill="url(#grid)"/><g id="drawing"></g><circle id="preview" r="7" fill="#1672ad" visibility="hidden"/></svg><small>Raster 25 cm · 100 tekeneenheden = 1 meter · PDF via afdrukfunctie van iPad · Gegevens worden lokaal op dit toestel opgeslagen.</small></main><script>
const svg=document.getElementById('canvas'),drawing=document.getElementById('drawing'),preview=document.getElementById('preview'),floor=document.getElementById('floor'),name=document.getElementById('name');let mode='wall',first=null,items=[],history=[];const key=()=>`sb23:${name.value.trim()||'zonder-naam'}:${floor.value}`;function load(){items=JSON.parse(localStorage.getItem(key())||'[]');first=null;render()}function persist(){localStorage.setItem(key(),JSON.stringify(items))}function snap(v){return Math.round(v/25)*25}function point(e){let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;let q=p.matrixTransform(svg.getScreenCTM().inverse());return {x:snap(q.x),y:snap(q.y)}}function el(tag,attrs,text){let e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(let k in attrs)e.setAttribute(k,attrs[k]);if(text)e.textContent=text;drawing.appendChild(e)}function render(){drawing.replaceChildren();for(let i of items){if(i.type==='wall'){el('line',{x1:i.a.x,y1:i.a.y,x2:i.b.x,y2:i.b.y,stroke:'#1b2b3a','stroke-width':9,'stroke-linecap':'square'});let mx=(i.a.x+i.b.x)/2,my=(i.a.y+i.b.y)/2,meters=(Math.hypot(i.a.x-i.b.x,i.a.y-i.b.y)/100).toFixed(2).replace('.',',');el('text',{x:mx,y:my-12,'font-size':18,'text-anchor':'middle',fill:'#475569'},meters+' m')}else if(i.type==='label'){el('text',{x:i.a.x,y:i.a.y,'font-size':24,'text-anchor':'middle',fill:'#1b2b3a'},i.text)}else{el('line',{x1:i.a.x-24,y1:i.a.y,x2:i.a.x+24,y2:i.a.y,stroke:i.type==='door'?'#b26d3e':'#2b8ac2','stroke-width':10})}}}function add(item){history.push([...items]);items.push(item);persist();render()}svg.addEventListener('pointerdown',e=>{let p=point(e);if(mode==='label'){let text=prompt('Naam van de ruimte:');if(text)add({type:'label',a:p,text});return}if(mode==='door'||mode==='window'){add({type:mode,a:p});return}if(!first){first=p;preview.setAttribute('cx',p.x);preview.setAttribute('cy',p.y);preview.setAttribute('visibility','visible');document.getElementById('hint').textContent='Tik het eindpunt van de muur aan.'}else{if(first.x!==p.x||first.y!==p.y)add({type:'wall',a:first,b:p});first=p;preview.setAttribute('visibility','hidden');document.getElementById('hint').textContent='Tik twee punten aan om een muur te tekenen.'}});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;first=null;preview.setAttribute('visibility','hidden');document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('hint').textContent=mode==='wall'?'Tik twee punten aan om een muur te tekenen.':mode==='label'?'Tik op de plek voor een ruimtenaam.':'Tik op de plek voor een '+(mode==='door'?'deur.':'raam.')});document.getElementById('undo').onclick=()=>{if(items.length){items.pop();persist();render()}};document.getElementById('clear').onclick=()=>{if(confirm('Dit verdiepingsplan wissen?')){items=[];persist();render()}};document.getElementById('save').onclick=()=>{persist();alert('Plan lokaal bewaard.')};document.getElementById('print').onclick=()=>window.print();floor.onchange=load;name.onchange=load;load();
</script><style>@media print{header,nav,.hint,small{display:none}main{padding:0}svg{height:auto;border:0;max-height:95vh}body{background:white}}</style></body></html>
